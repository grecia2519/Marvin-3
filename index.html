  const MENSAJE_GANAR = "yei";
  const MENSAJE_PERDER = "NO TE ME ACERQUES MARVIN!!!, BAÑATE";
  const META = 10;

  const c = document.getElementById("c");
  const g = c.getContext("2d");
  const nEl = document.getElementById("n");
  const vEl = document.getElementById("v");
  const fin = document.getElementById("fin");
  const carita = document.getElementById("carita");
  const mensaje = document.getElementById("mensaje");

  const gato = new Image();
  gato.src = IMG_GATO;
  const GW = 50, GH = 74;

  let gatoX = 150, objetos = [], puntos = 0, vidas = 3, frame = 0, activo = true;
  const teclas = { izq:false, der:false };

  function reiniciar() {
    puntos = 0; vidas = 3; objetos = []; frame = 0; activo = true;
    nEl.textContent = 0; vEl.textContent = 3;
    fin.style.display = "none";
  }

  function terminar(gano) {
    activo = false;
    carita.src = gano ? IMG_GANA : IMG_PIERDE;
    mensaje.textContent = gano ? MENSAJE_GANAR : MENSAJE_PERDER;
    mensaje.className = gano ? "gana" : "pierde";
    fin.style.display = "flex";
  }

  function mover(clientX) {
    const r = c.getBoundingClientRect();
    gatoX = (clientX - r.left) * (c.width / r.width);
    gatoX = Math.max(GW / 2, Math.min(c.width - GW / 2, gatoX));
  }

  c.addEventListener("pointerdown", e => mover(e.clientX));
  c.addEventListener("pointermove", e => mover(e.clientX));

  document.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft") teclas.izq = true;
    if (e.key === "ArrowRight") teclas.der = true;
  });
  document.addEventListener("keyup", e => {
    if (e.key === "ArrowLeft") teclas.izq = false;
    if (e.key === "ArrowRight") teclas.der = false;
  });

  function actualizar() {
    frame++;
    if (teclas.izq) gatoX = Math.max(GW / 2, gatoX - 5);
    if (teclas.der) gatoX = Math.min(c.width - GW / 2, gatoX + 5);

    if (frame % 35 === 0) {
      const malo = Math.random() < 0.3;
      objetos.push({
        x: 20 + Math.random() * (c.width - 40),
        y: -20,
        v: 2.5 + Math.random() * 1.5 + puntos / 10,
        malo: malo,
        e: malo ? "💩" : "🐟"
      });
    }

    objetos.forEach(o => o.y += o.v);

    objetos = objetos.filter(o => {
      if (o.y > c.height - GH && o.y < c.height - 5 && Math.abs(o.x - gatoX) < GW / 2 + 8) {
        if (o.malo) {
          vidas--;
          vEl.textContent = vidas;
        } else {
          puntos++;
          nEl.textContent = puntos;
        }
        return false;
      }
      return o.y < c.height + 20;
    });

    if (puntos >= META) terminar(true);
    else if (vidas <= 0) terminar(false);
  }

  function dibujar() {
    g.clearRect(0, 0, c.width, c.height);
    g.textAlign = "center";
    g.textBaseline = "middle";
    g.font = "26px sans-serif";
    objetos.forEach(o => g.fillText(o.e, o.x, o.y));
    if (gato.complete) g.drawImage(gato, gatoX - GW / 2, c.height - GH - 2, GW, GH);
  }

  function bucle() {
    if (activo) actualizar();
    dibujar();
    requestAnimationFrame(bucle);
  }
  bucle();

  document.getElementById("otra").onclick = reiniciar;
</script>
